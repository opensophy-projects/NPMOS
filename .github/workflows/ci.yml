# NPMOS CI. Upstream workflows under npmos/.github are not run (GitHub reads only the root .github).
#
# Images built by NPMOS: npmos (multi-arch) and npmos-appsec-{agent,smartsync,shared-storage,tuning}
# (amd64; arm64 is experimental, upstream open-appsec ships amd64 only).
# Publishing to Docker Hub (vars.DOCKERHUB_NAMESPACE, secrets.DOCKERHUB_USERNAME/DOCKERHUB_TOKEN):
#   push to work  -> :develop and :<sha>
#   tag vX.Y.Z    -> :X.Y.Z and :latest
#   other events  -> build and test only (registry login is still checked when secrets exist)
name: CI
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'opensophy' }}
  PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/work' || startsWith(github.ref, 'refs/tags/v')) && vars.DOCKERHUB_NAMESPACE != '' }}

jobs:
  checks:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: latest
      - name: backend
        working-directory: npmos/backend
        run: |
          pnpm install --frozen-lockfile
          # import ordering (biome assist) is not enforced: upstream code does not follow it
          pnpm biome ci . --assist-enabled=false
      - name: frontend
        working-directory: npmos/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm biome ci . --assist-enabled=false
          node check-locales.cjs
          pnpm formatjs compile-folder src/locale/src src/locale/lang
          pnpm tsc --noEmit
          pnpm vitest run
      - name: shell scripts
        run: shellcheck -x -S warning scripts/*.sh deploy/*/*.sh deploy/openappsec/*/*.sh npmos/crowdsec-seed/*.sh
      - name: compose files
        run: |
          docker compose -f deploy/compose.yaml config -q
          docker compose -f deploy/compose.yaml -f deploy/compose.dev.yaml config -q
          docker compose -f deploy/compose.yaml -f deploy/test/compose.airgap.yaml config -q
          if grep -nE 'image: .*:latest|:-latest' deploy/*.yaml deploy/test/*.yaml; then
            echo "::error::unpinned image version"; exit 1
          fi
      - name: version consistency
        run: |
          env_cs=$(sed -n 's/^CROWDSEC_VERSION=//p' deploy/.env)
          for f in npmos/Dockerfile deploy/dev/Dockerfile; do
            df_cs=$(sed -n 's/^ARG CROWDSEC_VERSION=//p' "$f")
            [ "$env_cs" = "$df_cs" ] || { echo "::error file=$f::CROWDSEC_VERSION $df_cs != deploy/.env $env_cs"; exit 1; }
          done
          . deploy/openappsec/sources.env
          for pair in "openappsec $OPENAPPSEC_REF" "smartsync $SMARTSYNC_REF" "smartsync-shared-files $SHARED_FILES_REF" "smartsync-tuning $TUNING_REF"; do
            set -- $pair
            grep -q "^| $1 | .* | \`$2\` |" reference/VERSIONS.md || { echo "::error::$1 ref $2 differs from reference/VERSIONS.md"; exit 1; }
          done
      - name: registry credentials
        # validates DOCKERHUB_USERNAME / DOCKERHUB_TOKEN on every push, also when nothing is published
        if: vars.DOCKERHUB_NAMESPACE != '' && github.event_name == 'push'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

  images:
    name: Images (amd64) + closed-network test
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: versions
        run: |
          v="$(git rev-parse --short HEAD)"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          grep -E "^[A-Z_]+=" deploy/openappsec/sources.env >> "$GITHUB_ENV"
          echo "CROWDSEC_VERSION=$(sed -n 's/^CROWDSEC_VERSION=//p' deploy/.env)" >> "$GITHUB_ENV"
          for f in npmos/frontend/package.json npmos/backend/package.json; do
            jq --arg v "$v" '.version = $v' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
      - name: build npmos
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: npmos
          load: true
          tags: docker.io/${{ env.NAMESPACE }}/npmos:${{ env.VERSION }}
          cache-from: type=gha,scope=npmos-amd64
          cache-to: type=gha,mode=max,scope=npmos-amd64
          build-args: |
            CROWDSEC_VERSION=${{ env.CROWDSEC_VERSION }}
            FLAGS=-march=x86-64-v2 -mtune=generic -fcf-protection=full
      - name: build npmos-appsec-agent
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/openappsec/agent
          load: true
          tags: docker.io/${{ env.NAMESPACE }}/npmos-appsec-agent:${{ env.VERSION }}
          cache-from: type=gha,scope=appsec-agent-amd64
          cache-to: type=gha,mode=max,scope=appsec-agent-amd64
          build-args: OPENAPPSEC_REF=${{ env.OPENAPPSEC_REF }}
      - name: build npmos-appsec-smartsync
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/openappsec/go-service
          load: true
          tags: docker.io/${{ env.NAMESPACE }}/npmos-appsec-smartsync:${{ env.VERSION }}
          cache-from: type=gha,scope=appsec-smartsync
          cache-to: type=gha,mode=max,scope=appsec-smartsync
          build-args: |
            REPO=https://github.com/openappsec/smartsync.git
            REF=${{ env.SMARTSYNC_REF }}
      - name: build npmos-appsec-shared-storage
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/openappsec/go-service
          load: true
          tags: docker.io/${{ env.NAMESPACE }}/npmos-appsec-shared-storage:${{ env.VERSION }}
          cache-from: type=gha,scope=appsec-shared-storage
          cache-to: type=gha,mode=max,scope=appsec-shared-storage
          build-args: |
            REPO=https://github.com/openappsec/smartsync-shared-files.git
            REF=${{ env.SHARED_FILES_REF }}
      - name: build npmos-appsec-tuning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/openappsec/go-service
          load: true
          tags: docker.io/${{ env.NAMESPACE }}/npmos-appsec-tuning:${{ env.VERSION }}
          cache-from: type=gha,scope=appsec-tuning
          cache-to: type=gha,mode=max,scope=appsec-tuning
          build-args: |
            REPO=https://github.com/openappsec/smartsync-tuning.git
            REF=${{ env.TUNING_REF }}
      - name: closed-network test (full stack)
        env:
          NPMOS_REGISTRY: docker.io/${{ env.NAMESPACE }}
          NPMOS_VERSION: ${{ env.VERSION }}
        run: scripts/test-airgap.sh
      - name: docker.io login
        if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: push
        if: env.PUBLISH == 'true'
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) tags="${GITHUB_REF#refs/tags/v} latest" ;;
            *) tags="develop" ;;
          esac
          for img in npmos npmos-appsec-agent npmos-appsec-smartsync npmos-appsec-shared-storage npmos-appsec-tuning; do
            src="docker.io/$NAMESPACE/$img:$VERSION"
            # npmos gets a multi-arch manifest in the manifest job; push its amd64 build under an arch tag
            if [ "$img" = npmos ]; then
              for t in $tags; do docker tag "$src" "docker.io/$NAMESPACE/$img:$t-amd64"; docker push "docker.io/$NAMESPACE/$img:$t-amd64"; done
            else
              docker push "$src"
              for t in $tags; do docker tag "$src" "docker.io/$NAMESPACE/$img:$t"; docker push "docker.io/$NAMESPACE/$img:$t"; done
            fi
          done

  npmos-arm64:
    name: npmos image (arm64)
    needs: checks
    if: github.event_name == 'push' && (github.ref == 'refs/heads/work' || startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: versions
        run: |
          v="$(git rev-parse --short HEAD)"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "CROWDSEC_VERSION=$(sed -n 's/^CROWDSEC_VERSION=//p' deploy/.env)" >> "$GITHUB_ENV"
          case "$GITHUB_REF" in
            refs/tags/v*) echo "TAGS=${GITHUB_REF#refs/tags/v} latest" >> "$GITHUB_ENV" ;;
            *) echo "TAGS=develop" >> "$GITHUB_ENV" ;;
          esac
          for f in npmos/frontend/package.json npmos/backend/package.json; do
            jq --arg v "$v" '.version = $v' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
      - name: docker.io login
        if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: build (and push arch tags)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: npmos
          push: ${{ env.PUBLISH == 'true' }}
          tags: docker.io/${{ env.NAMESPACE }}/npmos:${{ env.VERSION }}-arm64
          cache-from: type=gha,scope=npmos-arm64
          cache-to: type=gha,mode=max,scope=npmos-arm64
          build-args: |
            CROWDSEC_VERSION=${{ env.CROWDSEC_VERSION }}
            FLAGS=-mbranch-protection=standard
      - name: arch tags
        if: env.PUBLISH == 'true'
        run: |
          for t in $TAGS; do
            docker buildx imagetools create -t "docker.io/$NAMESPACE/npmos:$t-arm64" "docker.io/$NAMESPACE/npmos:$VERSION-arm64"
          done

  npmos-manifest:
    name: npmos multi-arch manifest
    needs: [images, npmos-arm64]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/work' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - name: docker.io login
        if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: manifest
        if: env.PUBLISH == 'true'
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) tags="${GITHUB_REF#refs/tags/v} latest" ;;
            *) tags="develop" ;;
          esac
          for t in $tags; do
            docker buildx imagetools create -t "docker.io/$NAMESPACE/npmos:$t" \
              "docker.io/$NAMESPACE/npmos:$t-amd64" "docker.io/$NAMESPACE/npmos:$t-arm64"
          done

  appsec-arm64:
    name: open-appsec images (arm64, experimental)
    needs: checks
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: grep -E "^[A-Z_]+=" deploy/openappsec/sources.env >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build npmos-appsec-agent (arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/openappsec/agent
          build-args: OPENAPPSEC_REF=${{ env.OPENAPPSEC_REF }}
          cache-from: type=gha,scope=appsec-agent-arm64
          cache-to: type=gha,mode=max,scope=appsec-agent-arm64
