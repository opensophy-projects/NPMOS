# NginxionS CI. Upstream workflows under nginxions/.github are not run (GitHub reads only the root .github).
#
# Images built by NginxionS: nginxions (multi-arch) and nginxions-openappsec (the agent, its shared storage and tuning
# services, nginxions-control; amd64, arm64 is experimental: upstream open-appsec ships amd64 only).
# Publishing to Docker Hub (vars.DOCKERHUB_NAMESPACE, secrets.DOCKERHUB_USERNAME/DOCKERHUB_TOKEN):
#   push to work  -> :develop and :<sha>
#   tag vX.Y.Z    -> :X.Y.Z and :latest
#   other events  -> build and test only (registry login is still checked when secrets exist)
#
# Three depths (docs/DEVSECOPS.md), chosen by the job "level":
#   fast            every push: lint, types, tests, and security.yml (SAST, secrets, SCA, IaC, the workflows)
#   full            also the images: build, closed-network test, image scan, DAST, the security gate before a push.
#                   On work, tags v*, pull requests, by hand (Run workflow, level "full") and on any push whose commit
#                   message holds [full].
#   extended        the full run and the heavy checks: ZAP full active scan, Nuclei with info and intrusive templates,
#                   API fuzzing (Schemathesis), runtime checks of the containers, CodeQL security-and-quality, more
#                   Semgrep rulesets, secrets of every branch, the images published on Docker Hub (every release).
#                   On branches security/** (security-weekly.yml makes one from work every week), on a pull request
#                   with the label security-scan (and on each push to it while the label stays) and by hand (Run
#                   workflow, level "extended", any branch).
# "report" writes the summary of the run and the artifact security-report (the report, readable SBOMs, raw results);
# on a branch security/** it also opens an issue with the report.
name: CI
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    # labeled: the label security-scan starts the extended run (the job "level" ignores other labels)
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      level:
        description: "Depth: fast (lint, tests, SAST), full (+ images, DAST), extended (+ heavy security checks)"
        type: choice
        options: [full, extended, fast]
        default: full

permissions:
  contents: read

concurrency:
  # a label other than security-scan gets a group of its own: it must not cancel the run of the pull request
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'security-scan'
    && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'opensophy' }}
  PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/work' || startsWith(github.ref, 'refs/tags/v')) && vars.DOCKERHUB_NAMESPACE != '' }}

jobs:
  level:
    name: Depth of the run
    runs-on: ubuntu-latest
    outputs:
      level: ${{ steps.level.outputs.level }}
    steps:
      - id: level
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          INPUT: ${{ inputs.level }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          case ",$LABELS," in *,security-scan,*) labelled=1 ;; *) labelled=0 ;; esac
          if [ "$EVENT" = pull_request ] && [ "$ACTION" = labeled ] && [ "$LABEL" != security-scan ]; then
            level=none
          elif [[ "$GITHUB_REF" == refs/heads/security/* ]] || { [ "$EVENT" = pull_request ] && [ "$labelled" = 1 ]; } ||
            { [ "$EVENT" = workflow_dispatch ] && [ "$INPUT" = extended ]; }; then
            level=extended
          elif [ "$EVENT" = workflow_dispatch ] && [ "$INPUT" = fast ]; then
            level=fast
          elif [ "$EVENT" != push ] || [ "$GITHUB_REF" = refs/heads/work ] || [[ "$GITHUB_REF" == refs/tags/v* ]] ||
            [[ "$MESSAGE" == *"[full]"* ]]; then
            level=full
          else
            level=fast
          fi
          echo "level=$level" >> "$GITHUB_OUTPUT"
          echo "### Глубина прогона: $level" >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: Lint, types, tests
    needs: level
    if: needs.level.outputs.level != 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          # no dependency cache: a cache written by one branch must not reach the build of another
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: latest
      - name: backend
        working-directory: nginxions/backend
        run: |
          pnpm install --frozen-lockfile
          # import ordering (biome assist) is not enforced: upstream code does not follow it
          pnpm biome ci . --assist-enabled=false
          # unit tests of NginxionS modules (upstream has none)
          node --test 'nginxions/**/*.test.js'
      - name: frontend
        working-directory: nginxions/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm biome ci . --assist-enabled=false
          node check-locales.cjs
          node ../../scripts/check-i18n.mjs
          pnpm formatjs compile-folder src/locale/src src/locale/lang
          pnpm tsc --noEmit
          pnpm vitest run
      - name: Go services of the agent (vet, tests)
        # shared storage and tuning (built into nginxions-openappsec) and smartsync, in the Go image of its Dockerfile
        run: scripts/test-go.sh
      - name: converter of Snort signatures of the agent (JavaScript = Python of upstream)
        run: node --test openappsec/agent/nodes/http_transaction_handler/package/snort_to_ips_local.test.mjs
      - name: file tree
        # every file of the code of NginxionS has a line in CODE_OF_CONDUCT.md
        run: node scripts/check-tree.mjs
      - name: WAF model tooling (model/, docs/MODEL.md)
        # the training cycle itself (numpy, scipy) is tested in training.yml; here the formats and the data
        run: python3 -m unittest discover -s model
      - name: shell scripts
        run: shellcheck -x -S warning scripts/*.sh deploy/*/*.sh deploy/openappsec/*/*.sh nginxions/crowdsec-seed/*.sh
      - name: compose files
        run: |
          docker compose -f deploy/compose.yaml config -q
          docker compose -f deploy/compose.yaml -f deploy/compose.dev.yaml config -q
          docker compose -f deploy/compose.yaml -f deploy/test/compose.airgap.yaml config -q
          NGINXIONS_FEATURES_DIR=/tmp/features docker compose -f deploy/compose.yaml -f deploy/test/compose.training.yaml config -q
          if grep -nE 'image: .*:latest|:-latest' deploy/*.yaml deploy/test/*.yaml; then
            echo "::error::unpinned image version"; exit 1
          fi
      - name: agent sources build with newer Boost (issue 113)
        run: |
          # boost::uuids::entropy_error is gone from Boost 1.86+: the agent catches std::exception instead. A subtree
          # pull of open-appsec brings the old catches back; this fails before the image build does.
          if grep -rn --include='*.cc' --include='*.h' 'catch *( *const boost::uuids::entropy_error' openappsec/; then
            echo "::error::catch std::exception, not boost::uuids::entropy_error (removed from Boost 1.86+)"; exit 1
          fi
      - name: version consistency
        run: |
          env_cs=$(sed -n 's/^CROWDSEC_VERSION=//p' deploy/.env)
          for f in nginxions/Dockerfile deploy/dev/Dockerfile; do
            # the image of the CrowdSec seed is pinned by tag and digest (OpenSSF Scorecard): its tag is deploy/.env's
            from_cs=$(sed -n 's|^FROM docker.io/crowdsecurity/crowdsec:\([^@ ]*\)@sha256:.*|\1|p' "$f")
            [ "$env_cs" = "$from_cs" ] || { echo "::error file=$f::FROM crowdsec:$from_cs != deploy/.env $env_cs"; exit 1; }
          done
          # the upstream commits of the sources in openappsec/ are full commits
          . deploy/openappsec/sources.env
          for ref in "$OPENAPPSEC_REF" "$ATTACHMENT_REF" "$SHARED_FILES_REF" "$TUNING_REF" "$SMARTSYNC_REF"; do
            echo "$ref" | grep -qE '^[0-9a-f]{40}$' || { echo "::error file=deploy/openappsec/sources.env::not a full commit: $ref"; exit 1; }
          done
          # a rule of renovate.json for a file that was moved stops matching without a word
          for f in $(jq -r '.packageRules[].matchFileNames[]? | select(test("[*?]") | not)' renovate.json); do
            [ -e "$f" ] || { echo "::error file=renovate.json::matchFileNames: $f does not exist"; exit 1; }
          done
      - name: registry credentials
        # validates DOCKERHUB_USERNAME / DOCKERHUB_TOKEN on every push, also when nothing is published
        if: vars.DOCKERHUB_NAMESPACE != '' && github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

  security:
    name: Security
    needs: level
    if: needs.level.outputs.level != 'none'
    uses: ./.github/workflows/security.yml
    with:
      level: ${{ needs.level.outputs.level }}
    permissions:
      contents: read
      security-events: write
      actions: read

  images:
    name: Images (amd64) + closed-network test + image scan + DAST
    needs: [level, checks]
    # the full and the extended run (see the head of this file); other branches stop after the fast checks
    if: needs.level.outputs.level == 'full' || needs.level.outputs.level == 'extended'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: versions
        run: |
          v="$(git rev-parse --short HEAD)"
          {
            echo "VERSION=$v"
            echo "CROWDSEC_VERSION=$(sed -n 's/^CROWDSEC_VERSION=//p' deploy/.env)"
          } >> "$GITHUB_ENV"
          for f in nginxions/frontend/package.json nginxions/backend/package.json; do
            jq --arg v "$v" '.version = $v' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
      - name: build nginxions
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: nginxions
          build-contexts: attachment=openappsec/attachment
          load: true
          tags: docker.io/${{ env.NAMESPACE }}/nginxions:${{ env.VERSION }}
          cache-from: type=gha,scope=nginxions-amd64
          cache-to: type=gha,mode=max,scope=nginxions-amd64
          build-args: |
            CROWDSEC_VERSION=${{ env.CROWDSEC_VERSION }}
            FLAGS=-march=x86-64-v2 -mtune=generic -fcf-protection=full
      - name: build nginxions-openappsec
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/openappsec
          build-contexts: |
            openappsec=openappsec
            control=nginxions/backend/nginxions/control
          load: true
          tags: docker.io/${{ env.NAMESPACE }}/nginxions-openappsec:${{ env.VERSION }}
          cache-from: type=gha,scope=openappsec-amd64
          cache-to: type=gha,mode=max,scope=openappsec-amd64
          # smartsync (central learning) is not built: it needs a Fog token the agent lacks in local-only
          # mode. NginxionS learns locally; see docs/adr/0011-learning.md.
      - name: closed-network test (full stack)
        env:
          NGINXIONS_REGISTRY: docker.io/${{ env.NAMESPACE }}
          NGINXIONS_VERSION: ${{ env.VERSION }}
        run: scripts/test-airgap.sh
      - name: image scan (Trivy, Syft SBOM, Grype, Dockle)
        env:
          NGINXIONS_REGISTRY: docker.io/${{ env.NAMESPACE }}
          NGINXIONS_VERSION: ${{ env.VERSION }}
          OUT: reports/images
        run: scripts/scan-images.sh
      - name: DAST (OWASP ZAP, Nuclei, testssl.sh, gixy; extended also Schemathesis and runtime checks)
        timeout-minutes: ${{ needs.level.outputs.level == 'extended' && 150 || 50 }}
        env:
          DAST_LEVEL: ${{ needs.level.outputs.level }}
          NGINXIONS_REGISTRY: docker.io/${{ env.NAMESPACE }}
          NGINXIONS_VERSION: ${{ env.VERSION }}
          OUT: reports/dast
        run: scripts/test-dast.sh
      # accepted risks of the images leave the SARIF of code scanning (docs/DEVSECOPS.md); the report keeps them
      - name: accepted risks out of the SARIF of the images
        if: always()
        run: |
          mkdir -p upload
          for img in nginxions nginxions-openappsec; do
            f="reports/images/trivy-$img.sarif"
            [ -f "$f" ] && node scripts/sarif-accepted.mjs "trivy-$img" "$f" "upload/trivy-$img.sarif"
          done
          true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && hashFiles('upload/trivy-nginxions.sarif') != ''
        with:
          sarif_file: upload/trivy-nginxions.sarif
          category: trivy-nginxions
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && hashFiles('upload/trivy-nginxions-openappsec.sarif') != ''
        with:
          sarif_file: upload/trivy-nginxions-openappsec.sarif
          category: trivy-nginxions-openappsec
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-images
          path: reports/
          if-no-files-found: ignore
      - name: security gate (nothing is pushed with a blocking finding)
        run: node scripts/security-report.mjs --in reports --scope images,dast --expect images,dast
      - name: docker.io login
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: push
        if: env.PUBLISH == 'true'
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) tags="${GITHUB_REF#refs/tags/v} latest" ;;
            *) tags="develop" ;;
          esac
          for img in nginxions nginxions-openappsec; do
            src="docker.io/$NAMESPACE/$img:$VERSION"
            # nginxions gets a multi-arch manifest in the manifest job; push its amd64 build under an arch tag
            if [ "$img" = nginxions ]; then
              for t in $tags; do docker tag "$src" "docker.io/$NAMESPACE/$img:$t-amd64"; docker push "docker.io/$NAMESPACE/$img:$t-amd64"; done
            else
              docker push "$src"
              for t in $tags; do docker tag "$src" "docker.io/$NAMESPACE/$img:$t"; docker push "docker.io/$NAMESPACE/$img:$t"; done
            fi
          done

  nginxions-arm64:
    name: nginxions image (arm64)
    needs: [level, checks]
    if: >-
      github.event_name == 'push' && (github.ref == 'refs/heads/work' || startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/heads/security/') &&
      needs.level.outputs.level != 'fast'
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: versions
        run: |
          v="$(git rev-parse --short HEAD)"
          case "$GITHUB_REF" in
            refs/tags/v*) tags="${GITHUB_REF#refs/tags/v} latest" ;;
            *) tags="develop" ;;
          esac
          {
            echo "VERSION=$v"
            echo "CROWDSEC_VERSION=$(sed -n 's/^CROWDSEC_VERSION=//p' deploy/.env)"
            echo "TAGS=$tags"
          } >> "$GITHUB_ENV"
          for f in nginxions/frontend/package.json nginxions/backend/package.json; do
            jq --arg v "$v" '.version = $v' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
      - name: docker.io login
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: build (and push arch tags)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: nginxions
          build-contexts: attachment=openappsec/attachment
          push: ${{ env.PUBLISH == 'true' }}
          tags: docker.io/${{ env.NAMESPACE }}/nginxions:${{ env.VERSION }}-arm64
          cache-from: type=gha,scope=nginxions-arm64
          cache-to: type=gha,mode=max,scope=nginxions-arm64
          build-args: |
            CROWDSEC_VERSION=${{ env.CROWDSEC_VERSION }}
            FLAGS=-mbranch-protection=standard
      - name: arch tags
        if: env.PUBLISH == 'true'
        run: |
          for t in $TAGS; do
            docker buildx imagetools create -t "docker.io/$NAMESPACE/nginxions:$t-arm64" "docker.io/$NAMESPACE/nginxions:$VERSION-arm64"
          done

  nginxions-manifest:
    name: nginxions multi-arch manifest
    needs: [images, nginxions-arm64]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/work' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - name: docker.io login
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: manifest
        if: env.PUBLISH == 'true'
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) tags="${GITHUB_REF#refs/tags/v} latest" ;;
            *) tags="develop" ;;
          esac
          for t in $tags; do
            docker buildx imagetools create -t "docker.io/$NAMESPACE/nginxions:$t" \
              "docker.io/$NAMESPACE/nginxions:$t-amd64" "docker.io/$NAMESPACE/nginxions:$t-arm64"
          done

  appsec-arm64:
    name: nginxions-openappsec image (arm64, experimental)
    needs: [level, checks]
    if: >-
      github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/heads/security/') &&
      needs.level.outputs.level != 'fast'
    continue-on-error: true
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build nginxions-openappsec (arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/openappsec
          build-contexts: |
            openappsec=openappsec
            control=nginxions/backend/nginxions/control
          cache-from: type=gha,scope=openappsec-arm64
          cache-to: type=gha,mode=max,scope=openappsec-arm64

  report:
    name: Security report
    needs: [level, checks, security, images]
    if: always() && needs.level.outputs.level != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # the issue of a weekly branch security/<date>
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: security-*
          path: reports
          merge-multiple: true
      - name: summary
        env:
          # the images and DAST are expected only when the images were built, the heavy checks only in the extended run
          EXPECT: >-
            ${{ needs.images.result == 'skipped' && 'source' || 'source,images,dast' }}${{
            needs.level.outputs.level == 'extended' && (needs.images.result == 'skipped' && ',published' ||
            ',published,extended') || '' }}
        run: node scripts/security-report.mjs --in reports --out security-report --summary "$GITHUB_STEP_SUMMARY" --expect "$EXPECT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-report
          path: security-report/
      - name: issue with the report (weekly branch security/<date>)
        if: always() && startsWith(github.ref, 'refs/heads/security/') && hashFiles('security-report/security-report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if grep -q 'Итог: ✅' security-report/security-report.md; then mark="✅"; else mark="❌"; fi
          {
            echo "Еженедельная проверка ветки \`$REF_NAME\` (сделана из \`work\`). Прогон: $RUN_URL"
            echo "Полный отчёт и SBOM — артефакт **security-report** прогона."
            echo
            head -c 60000 security-report/security-report.md
          } > issue.md
          gh label create security --repo "$REPO" --color B60205 --description "Security reports" --force > /dev/null
          gh issue create --repo "$REPO" --label security --title "$mark Отчёт безопасности ${REF_NAME#security/}" --body-file issue.md
