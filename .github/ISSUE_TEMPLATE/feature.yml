name: Предложение
description: Новая возможность или улучшение
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую задачу решает
      description: Не «добавьте кнопку», а «мне нужно …, сейчас приходится …»
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Как это видите
      description: Где в интерфейсе и как работает; пример
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Что уже пробовали
  - type: checkboxes
    id: principles
    attributes:
      label: Принципы NginxionS
      options:
        - label: Работает без интернета (обращение наружу — только опция администратора)
          required: true
        - label: Включается и настраивается из интерфейса, без правки compose и консольных команд
          required: true
