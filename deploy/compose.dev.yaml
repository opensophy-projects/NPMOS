# NginxionS — development overlay on top of compose.yaml.
#
#   docker compose -f deploy/compose.yaml -f deploy/compose.dev.yaml up -d --build
#   docker compose -f deploy/compose.yaml -f deploy/compose.dev.yaml watch   # backend live sync
#   cd nginxions/frontend && pnpm install && pnpm vite                             # UI with hot reload
#
# Adds: nginxions built from local sources (fast dev image), a test upstream and,
# with --profile attack, a generator of malicious requests for WAF testing.

services:
  nginxions-init:
    image: nginxions:dev

  nginxions:
    image: nginxions:dev
    build:
      context: ../nginxions
      dockerfile: ../deploy/dev/Dockerfile
      args:
        CROWDSEC_VERSION: ${CROWDSEC_VERSION}
        # optional, for building behind restricted networks (see nginxions/crowdsec-seed/seed.sh)
        HUB_URL_TEMPLATE: ${HUB_URL_TEMPLATE:-}
    environment:
      TZ: ${TZ:-UTC}
    develop:
      watch:
        - path: ../nginxions/backend
          target: /app
          action: sync+restart
          ignore:
            - node_modules/
        - path: ../nginxions/rootfs
          action: rebuild

  # Proxy host target for manual and automated tests: http://test-upstream:80
  test-upstream:
    image: docker.io/traefik/whoami:${WHOAMI_VERSION}
    container_name: nginxions-test-upstream
    restart: unless-stopped
    networks:
      - internal

  attacker:
    image: docker.io/curlimages/curl:${CURL_VERSION}
    container_name: nginxions-attacker
    profiles:
      - attack
    depends_on:
      - nginxions
    entrypoint: ["/bin/sh", "/attack.sh"]
    environment:
      TARGET: http://nginxions
      HOST: ${ATTACK_HOST:-test.local}
    volumes:
      - ./dev/attack.sh:/attack.sh:ro
    networks:
      - internal
