# NginxionS — default stack, fully local (no cloud services, no CAPI, no agent token).
#
#   docker compose -f deploy/compose.yaml up -d
#   open https://<host>:81
#
# Everything that cannot be changed from the NginxionS GUI lives here and is wired up
# in advance (shared volumes, IPC, networks, secrets), so that enabling WAF or
# CrowdSec later is a switch in the GUI, not an edit of this file.
# Settings below are bootstrap parameters only; see docs/ENV-INVENTORY.md.
#
# Containers: nginxions (nginx, the panel, the backend), openappsec (the WAF agent and its learning services,
# nginxions-control), crowdsec, clamav (File Security of the WAF policy), postgres; nginxions-init runs once at start. nginxions and openappsec are built by the
# NginxionS project (${NGINXIONS_REGISTRY}/nginxions, /nginxions-openappsec), CrowdSec and Postgres are the official images.
# Versions are pinned in deploy/.env (read automatically by compose).
#
# Requires Docker Engine >= 26 and Compose >= 2.23 (volume subpath mounts).

name: nginxions

x-managed: &managed
  restart: unless-stopped
  labels:
    nginxions.managed: "true"

services:
  # One-shot bootstrap (deploy/init/nginxions-init.sh): secrets, subpath directories,
  # CrowdSec volumes seeded from the offline hub snapshot. Never overwrites existing data.
  nginxions-init:
    image: ${NGINXIONS_REGISTRY}/nginxions:${NGINXIONS_VERSION}
    restart: "no"
    network_mode: none
    # no process gains privileges it did not start with (setuid binaries, file capabilities)
    security_opt:
      - no-new-privileges:true
    # root on volumes that are root's: no capability is needed (no chown to another user)
    cap_drop:
      - ALL
    entrypoint: ["/bin/sh", "/nginxions-init.sh"]
    # a one-time job: healthy once the secrets are written
    healthcheck:
      test: ["CMD", "test", "-s", "/secrets/nginxions/db_password"]
      interval: 5s
      timeout: 3s
      retries: 3
    volumes:
      - ./init/nginxions-init.sh:/nginxions-init.sh:ro
      - secrets:/secrets
      # only to pre-create directories other services mount by subpath
      - nginxions-data:/nginxions-data
      - crowdsec-conf:/crowdsec-conf
      - crowdsec-data:/crowdsec-data
      - appsec-conf:/appsec-conf
      - appsec-localconfig:/appsec-localconfig

  # open-appsec: the agent, its shared storage and tuning services and nginxions-control (the Docker API of System ->
  # Services) in one container (deploy/openappsec). It owns the network and IPC namespaces nginxions joins: the
  # published ports are here, nginx of nginxions listens on them; the nginx attachment talks to the agent through the
  # shared IPC and /dev/shm/check-point. Its services listen on 127.0.0.1 there: control 7080, shared storage 7811,
  # tuning 7813, the agent 7777.
  openappsec:
    <<: *managed
    image: ${NGINXIONS_REGISTRY}/nginxions-openappsec:${NGINXIONS_VERSION}
    container_name: nginxions-openappsec
    # no process gains privileges it did not start with (setuid binaries, file capabilities)
    security_opt:
      - no-new-privileges:true
    # the agent and its services run as root on files of root; the Docker socket is root's: no capability is needed
    cap_drop:
      - ALL
    # the namespace of the network is this container's: nginx of nginxions listens on 80, 443 and 81 without the
    # capability NET_BIND_SERVICE
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    # the same check as the image: nginxions-control answers, or the agent listens
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "wget -q -T 4 -O /dev/null http://127.0.0.1:7080/healthz || nc -z -w 4 127.0.0.1 7777"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    depends_on:
      nginxions-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ipc: shareable
    # NGINXIONS_BIND_IP: the address of the host the ports are published on (all of them by default: a reverse proxy);
    # NGINXIONS_ADMIN_BIND_IP: the one of the interface (81), e.g. 127.0.0.1 or an address of a management network
    ports:
      - "${NGINXIONS_BIND_IP:-0.0.0.0}:${NGINXIONS_HTTP_PORT:-80}:80/tcp"
      - "${NGINXIONS_BIND_IP:-0.0.0.0}:${NGINXIONS_HTTPS_PORT:-443}:443/tcp"
      - "${NGINXIONS_BIND_IP:-0.0.0.0}:${NGINXIONS_HTTPS_PORT:-443}:443/udp"
      - "${NGINXIONS_ADMIN_BIND_IP:-0.0.0.0}:${NGINXIONS_ADMIN_PORT:-81}:81/tcp"
    # Hybrid mode (= --standalone in the open-appsec docs) applies the declarative local_policy.yaml
    # written by NginxionS (offline mode only reads a compiled policy). The agent of NginxionS
    # (openappsec/agent) has no cloud: it never registers, never connects to a Fog and refuses any
    # message to a host of open-appsec (Check Point), whatever its configuration says.
    command: ["--hybrid-mode"]
    environment:
      TZ: ${TZ:-UTC}
      # host:port in this namespace (our change in openappsec/agent: the agent asks them on port 80, which is nginx's)
      SHARED_STORAGE_HOST: 127.0.0.1:7811
      TUNING_HOST: 127.0.0.1:7813
      # No LEARNING_HOST: central learning (smartsync, several agents) is not in the stack. NginxionS
      # learns locally; see docs/adr/0011-learning.md.
      # security events also go to the local tuning service (its Postgres DB feeds learning and
      # tuning suggestions); NginxionS keeps its own copy from the log files (nginxions/backend/nginxions/events)
      LOCAL_TUNING_ENABLED: "true"
      # NginxionS also asks the agent to apply each new policy at once (set-apply-policy); this is the fallback
      autoPolicyLoad: "true"
      # the tuning service: its database
      QUERY_DB_HOST: postgres
      QUERY_DB_USER: appsec
      QUERY_DB_PASSWORD_FILE: /run/secrets/appsec/db_password
      NGINXIONS_CONTROL_TOKEN_FILE: /run/secrets/control/control_token
    volumes:
      - appsec-shm:/dev/shm/check-point
      - appsec-conf:/etc/cp/conf
      - appsec-data:/etc/cp/data
      - appsec-logs:/var/log/nano_agent
      - appsec-localconfig:/ext/appsec
      - appsec-storage:/db
      # advanced ML model uploaded in WAF -> Agent, unpacked by the entrypoint at start
      - appsec-model:/advanced-model:ro
      # nginxions-control: only list, logs, restart and reload of this stack's nginxions.managed containers
      # (nginxions/backend/nginxions/control/server.js); nginxions itself never gets the socket
      - /var/run/docker.sock:/var/run/docker.sock
      - type: volume
        source: secrets
        target: /run/secrets/nginxions
        read_only: true
        volume:
          subpath: appsec-agent
      - type: volume
        source: secrets
        target: /run/secrets/appsec
        read_only: true
        volume:
          subpath: appsec
      - type: volume
        source: secrets
        target: /run/secrets/control
        read_only: true
        volume:
          subpath: control
    networks:
      # "nginxions": the name nginx and the panel had before, for the clients of the networks
      edge:
        aliases: [nginxions]
      internal:
        aliases: [nginxions]

  nginxions:
    <<: *managed
    image: ${NGINXIONS_REGISTRY}/nginxions:${NGINXIONS_VERSION}
    container_name: nginxions
    depends_on:
      nginxions-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      openappsec:
        condition: service_started
    # the network (ports) and IPC of openappsec; nginxions-control restarts nginxions when openappsec was restarted
    network_mode: service:openappsec
    ipc: service:openappsec
    cap_drop:
      - ALL
    # nginx (root) sets the groups of its workers; the ports below 1024 need no capability (sysctls of openappsec)
    cap_add:
      - SETGID
    security_opt:
      - no-new-privileges:true
    # the same check as the image
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    environment:
      TZ: ${TZ:-UTC}
      DB_POSTGRES_HOST: postgres
      DB_POSTGRES_NAME: nginxions
      DB_POSTGRES_USER: nginxions
      DB_POSTGRES_PASSWORD_FILE: /run/nginxions-secrets/db_password
      COOKIE_SECRET_FILE: /run/nginxions-secrets/cookie_secret
      # access/stream logs to /data/nginx/logs — read by CrowdSec
      LOGROTATE: "true"
      # open-appsec ML-WAF is part of NginxionS, so its nginx attachment is loaded by default: the agent is
      # already running, WAF -> Agent shows it enabled, and turning on WAF for a host works at once (no
      # separate global switch + restart first). The attachment is fail-open and hosts are inactive until
      # protected, so idle cost is small. Turn it off in WAF -> Agent (that restart unloads the module).
      NGINX_LOAD_OPENAPPSEC_ATTACHMENT_MODULE: ${NGINXIONS_WAF_ENABLED:-true}
      # IPv4 only by default: nginx does not listen on IPv6 and its resolver asks for IPv4 only, so
      # NginxionS starts on hosts where IPv6 is off or broken. NGINXIONS_DISABLE_IPV6=false turns IPv6 on.
      DISABLE_IPV6: ${NGINXIONS_DISABLE_IPV6:-true}
    volumes:
      - nginxions-data:/data
      - type: volume
        source: secrets
        target: /run/nginxions-secrets
        read_only: true
        volume:
          subpath: nginxions
      # open-appsec: attachment shared memory, declarative policy, agent logs
      - appsec-shm:/dev/shm/check-point
      - appsec-localconfig:/ext/appsec
      - appsec-logs:/ext/appsec-logs:ro
      - appsec-model:/ext/appsec-model
      # CrowdSec: configuration generated from the GUI (acquisition, profiles, allowlists, hub items)
      # and its database (machines, bouncers), at the paths of the crowdsec container so that hub
      # symlinks resolve in both (nginxions/backend/nginxions/crowdsec)
      - crowdsec-conf:/etc/crowdsec
      - crowdsec-data:/var/lib/crowdsec/data
      # File Security (WAF policy): the flag that starts clamd, signature files uploaded in the GUI
      - clamav-control:/var/lib/nginxions-clamav

  postgres:
    <<: *managed
    image: docker.io/library/postgres:${POSTGRES_VERSION}
    container_name: nginxions-postgres
    # no process gains privileges it did not start with (setuid binaries, file capabilities)
    security_opt:
      - no-new-privileges:true
    # the entrypoint of the image (root) gives the data directory to the user postgres and switches to it
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    depends_on:
      nginxions-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/nginxions-secrets/postgres_password
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./init/postgres-init.sh:/docker-entrypoint-initdb.d/nginxions.sh:ro
      - type: volume
        source: secrets
        target: /run/nginxions-secrets
        read_only: true
        volume:
          subpath: postgres
    networks:
      - internal

  crowdsec:
    <<: *managed
    # official image; config and data volumes are seeded by nginxions-init from the offline hub snapshot
    image: docker.io/crowdsecurity/crowdsec:${CROWDSEC_VERSION}
    container_name: nginxions-crowdsec
    # no process gains privileges it did not start with (setuid binaries, file capabilities)
    security_opt:
      - no-new-privileges:true
    # CrowdSec runs as root on files of root (its volumes, the logs it reads): no capability is needed
    cap_drop:
      - ALL
    depends_on:
      nginxions-init:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-UTC}
      USE_WAL: "true"
      # Local only: no Central API (no signal sharing, no community blocklist), no hub upgrades at start.
      # Hub items come from the seeded snapshot; a failed hub update at start is tolerated by the image.
      DISABLE_ONLINE_API: "true"
      NO_HUB_UPGRADE: "true"
    # the image has none: healthy once its Local API answers (System -> Services shows the state)
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    volumes:
      - crowdsec-conf:/etc/crowdsec
      - crowdsec-data:/var/lib/crowdsec/data
      - type: volume
        source: secrets
        # the official image registers a bouncer for every /run/secrets/bouncer_key_<name>
        target: /run/secrets
        read_only: true
        volume:
          subpath: crowdsec
      - type: volume
        source: nginxions-data
        target: /var/log/nginxions
        read_only: true
        volume:
          subpath: nginx/logs
      - appsec-logs:/var/log/openappsec:ro
    networks:
      - internal

  clamav:
    <<: *managed
    # official image with a snapshot of the signatures; clamd runs only while a practice of the WAF policy has File
    # Security on (deploy/clamav/nginxions-clamav.sh): without it the container waits and takes no memory
    image: docker.io/clamav/clamav:${CLAMAV_VERSION}
    container_name: nginxions-clamav
    entrypoint: ["/bin/sh", "/nginxions-clamav.sh"]
    security_opt:
      - no-new-privileges:true
    # the entrypoint of the image hands /var/lib/clamav to its user clamav, clamd drops to it
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      TZ: ${TZ:-UTC}
      # an upload is streamed to clamd whole (nginxions_files.lua): the limits of the practice come first
      CLAMD_CONF_StreamMaxLength: 200M
      CLAMD_CONF_MaxFileSize: 200M
      CLAMD_CONF_MaxScanSize: 400M
      # an archive clamd cannot open is a finding: archivedFilesWhereContentExtractionFailed of the practice
      CLAMD_CONF_AlertEncryptedArchive: "yes"
      CLAMD_CONF_AlertExceedsMax: "yes"
      # the deep static analysis of threatEmulationEnabled; nginx leaves these findings out for practices without it
      CLAMD_CONF_AlertOLE2Macros: "yes"
      CLAMD_CONF_AlertBrokenExecutables: "yes"
      CLAMD_CONF_AlertBrokenMedia: "yes"
      CLAMD_CONF_AlertPartitionIntersection: "yes"
    healthcheck:
      # healthy while it waits (File Security off) or once clamd answers
      test: ["CMD-SHELL", "[ ! -f /nginxions/enabled ] || clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 5m
      retries: 3
    volumes:
      - ./clamav/nginxions-clamav.sh:/nginxions-clamav.sh:ro
      - clamav-db:/var/lib/clamav
      - clamav-control:/nginxions:ro
    networks:
      - internal

networks:
  # published ports; egress only for what the admin enables (e.g. ACME)
  edge: {}
  # service-to-service traffic, no internet access
  internal:
    internal: true

volumes:
  secrets: {}
  nginxions-data: {}
  postgres-data: {}
  appsec-shm:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
  appsec-conf: {}
  appsec-data: {}
  appsec-logs: {}
  appsec-localconfig: {}
  appsec-model: {}
  appsec-storage: {}
  crowdsec-conf: {}
  crowdsec-data: {}
  # the signatures of ClamAV (the snapshot of the image on the first start, then freshclam or uploads)
  clamav-db: {}
  # written by NginxionS, read by clamav: the flag that starts clamd, uploaded signature files
  clamav-control: {}
