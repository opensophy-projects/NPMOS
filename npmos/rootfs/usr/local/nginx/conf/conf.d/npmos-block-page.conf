# NPMOS: the block page (Agents → Block page). A 403 nginx answers itself (open-appsec, the CrowdSec bouncer,
# an access list), not one of an upstream, gets the page NPMOS renders into /data/npmos/block-page.html; the
# admin interface (port 81) and the pages of NPMOS (/.npmos/) keep their own.
header_filter_by_lua_block {
  -- loaded once per worker (the path of the CrowdSec bouncer is the only lua_package_path)
  local bp = package.loaded.npmos_block_page
  if not bp then
    bp = dofile("/usr/local/lua/npmos/npmos_block_page.lua")
    package.loaded.npmos_block_page = bp
  end
  if ngx.status ~= 403 or ngx.var.server_port == "81" then return end
  local upstream = ngx.var.upstream_status
  if upstream ~= nil and upstream ~= "" then return end
  if string.sub(ngx.var.uri or "", 1, 8) == "/.npmos/" then return end
  local page = bp.page()
  if not page then return end
  ngx.ctx.npmos_block_page = page
  ngx.header["Content-Type"] = "text/html; charset=utf-8"
  ngx.header["Content-Length"] = nil
  ngx.header["Content-Encoding"] = nil
  ngx.header["Cache-Control"] = "no-store"
}
body_filter_by_lua_block {
  local page = ngx.ctx.npmos_block_page
  if not page then return end
  if ngx.ctx.npmos_block_page_sent then
    ngx.arg[1] = nil
    return
  end
  ngx.ctx.npmos_block_page_sent = true
  ngx.arg[1] = package.loaded.npmos_block_page.fill(page)
  ngx.arg[2] = true
}
