# NPMOS: requests refused by mTLS (location /.npmos/mtls-denied.html of _npmos_mtls.conf), read by
# npmos/pki/denials.js into the security events
log_format npmos_mtls escape=json '{"time":"$time_iso8601","host":"$host","ip":"$remote_addr","method":"$request_method","uri":"$request_uri","verify":"$ssl_client_verify","s_dn":"$ssl_client_s_dn","i_dn":"$ssl_client_i_dn","serial":"$ssl_client_serial","ua":"$http_user_agent"}';
