upstream npmplus {
  server unix:/run/npmplus.sock;
}

server {
  server_name "";
  listen 0.0.0.0:81 ssl;
  listen [::]:81 ssl;
  ssl_reject_handshake on;
  return 444;
}

server {
  listen 0.0.0.0:81 ssl bind reuseport deferred multipath so_keepalive=on default_server;
  listen [::]:81 ssl bind reuseport deferred multipath so_keepalive=on default_server;

  server_name _;
  # NPMOS: logged with its port (alog_admin), start.sh switches it on with the access log
  access_log off; # admin
  # NPMOS: the interface is not inspected by open-appsec (start.sh uncomments this when the
  # attachment is loaded): requests of the GUI never wait for the agent
  #cp-nano-nginx-attachment off;
  ssl_certificate ;
  ssl_certificate_key ;
  #ssl_stapling on;
  #ssl_stapling_verify on;
  #ssl_stapling_file ;
  #ssl_certificate_compression off;

  if ($scheme = "http") {
    return 301 https://$host$is_request_port$request_port$request_uri;
  }
  if ($http_x_forwarded_proto = "http") {
    return 301 https://$host$is_request_port$request_port$request_uri;
  }

  client_max_body_size 1m;
  more_set_headers "X-Frame-Options: DENY";
  more_set_headers "Referrer-Policy: no-referrer";
  more_set_headers "Cross-Origin-Opener-Policy: same-origin";
  more_set_headers "Cross-Origin-Resource-Policy: same-origin";
  more_set_headers "Cross-Origin-Embedder-Policy: require-corp";
  # NPMOS: without ambient-light-sensor, bluetooth and web-share (Chrome logs them as unrecognized)
  more_set_headers "Permissions-Policy: accelerometer=(), aria-notify=(), attribution-reporting=(), autoplay=(), browsing-topics=(), camera=(), captured-surface-control=(), ch-ua-high-entropy-values=(), compute-pressure=(), cross-origin-isolated=(), deferred-fetch=(), deferred-fetch-minimal=(), display-capture=(), encrypted-media=(), fullscreen=(), gamepad=(), geolocation=(), gyroscope=(), hid=(), identity-credentials-get=(), idle-detection=(), local-fonts=(), local-network=(), local-network-access=(), loopback-network=(), magnetometer=(), microphone=(), midi=(), on-device-speech-recognition=(), otp-credentials=(), payment=(), picture-in-picture=(), private-state-token-issuance=(), private-state-token-redemption=(), publickey-credentials-create=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), storage-access=(), summarizer=(), usb=(), window-management=(), xr-spatial-tracking=()";

  location / {
    # NPMOS: font-src 'self' for the bundled Inter font (phase 2)
    more_set_headers "Content-Security-Policy: default-src 'none'; font-src 'self'; script-src-elem 'self' 'sha256-DO5PcuswBpDi7xOFPuj86dwr9VuamByHpvk2ZDmlAAA='; style-src-elem 'self' 'sha256-47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU=' 'sha256-AVTm08UMHPqpttgoudpSsvenKKfidtwuSnUVJLIuqcA='; connect-src 'self' data:; img-src 'self' data:; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests;";
    root /app/frontend;
    try_files $uri /index.html;
  }

  location /images/gravatar/ {
    more_set_headers "Content-Security-Policy: default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests;";
    alias /data/npmplus/gravatar/;
  }

  location /api {
    more_set_headers "Content-Security-Policy: default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests;";
    include proxy-headers.conf;
    proxy_set_header Accept-Encoding "";
    proxy_pass http://npmplus;
  }

  # NPMOS: upload of the open-appsec advanced model (WAF -> Agent), streamed to the backend
  location = /api/npmos/waf/agent/model {
    more_set_headers "Content-Security-Policy: default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests;";
    client_max_body_size 1g;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    include proxy-headers.conf;
    proxy_set_header Accept-Encoding "";
    proxy_pass http://npmplus;
  }

  # NPMOS: CrowdSec: saving settings restarts CrowdSec and may roll back (minutes), blocklists are
  # uploaded as text (up to 20 MB), hub snapshots as files (up to 200 MB)
  location /api/npmos/crowdsec {
    more_set_headers "Content-Security-Policy: default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests;";
    client_max_body_size 20m;
    proxy_read_timeout 300s;
    include proxy-headers.conf;
    proxy_set_header Accept-Encoding "";
    proxy_pass http://npmplus;
  }

  location = /api/npmos/crowdsec/hub/snapshot {
    more_set_headers "Content-Security-Policy: default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests;";
    client_max_body_size 200m;
    proxy_read_timeout 300s;
    include proxy-headers.conf;
    proxy_set_header Accept-Encoding "";
    proxy_pass http://npmplus;
  }

  # NPMOS: GeoIP databases (.mmdb) are uploaded as files (up to 200 MB)
  location = /api/npmos/system/geoip {
    more_set_headers "Content-Security-Policy: default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests;";
    client_max_body_size 200m;
    proxy_read_timeout 300s;
    include proxy-headers.conf;
    proxy_set_header Accept-Encoding "";
    proxy_pass http://npmplus;
  }

  # NPMOS: migration from NPM/NPMplus: an archive of the old /data (up to 2 GB), streamed to disk
  location = /api/npmos/system/migration/upload {
    more_set_headers "Content-Security-Policy: default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests;";
    client_max_body_size 2g;
    proxy_request_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    include proxy-headers.conf;
    proxy_set_header Accept-Encoding "";
    proxy_pass http://npmplus;
  }

  location /api/docs {
    more_set_headers "Content-Security-Policy: default-src 'none'; script-src-elem 'self'; style-src-elem 'self' 'sha256-/jDKvbQ8cdux+c5epDIqkjHbXDaIY8RucT1PmAe8FG4=' 'sha256-BeXIQk2DxxoDrgnnoH683KOnlwQvO0HH1fT4VFQTi8g=' 'sha256-RL3ie0nH+Lzz2YNqQN83mnU0J1ot4QL7b99vMdIX99w='; style-src-attr 'unsafe-hashes' 'sha256-ezdv1bOGcoOD7FKudKN0Y2Mb763O6qVtM8LT2mtanIU='; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests;";
    include proxy-headers.conf;
    proxy_set_header Accept-Encoding "";
    proxy_pass http://npmplus;
  }
}
