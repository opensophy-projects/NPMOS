# NPMOS: the OCSP responder of PKI and mTLS for nginx itself (ssl_ocsp_responder of hosts with revocation by
# OCSP, backend/templates/_npmos_mtls.conf). Plain HTTP on the loopback only: nginx asks over HTTP, and the
# answers are signed.
server {
  listen 127.0.0.1:7089;
  access_log off;

  location /api/npmos/pki/public/ocsp/auto/ {
    proxy_pass http://npmplus;
  }

  location / {
    return 404;
  }
}
