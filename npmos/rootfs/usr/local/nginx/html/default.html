<!DOCTYPE html>
<!-- NPMOS: the page of a host that is not set up yet (was the NPMplus "Congratulations!" page) -->
<html>
  <head>
    <title>NPMOS</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="NPMOS" />
    <meta name="robots" content="noindex" />
    <style>
      body {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 16px;
        background: #fff;
        color: #111;
      }
      main {
        max-width: 560px;
        margin: 15vh auto 0;
        padding: 2rem;
        border-radius: 1rem;
        background: rgb(243 244 246);
      }
      h1 {
        font-size: 24px;
        margin-top: 0;
      }
      p {
        font-size: 16px;
        line-height: 1.5;
      }
      section + section {
        margin-top: 2rem;
        padding-top: 1rem;
        border-top: 1px solid rgb(209 213 219);
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: rgb(17 24 39);
          color: #fff;
        }
        main {
          background: rgb(31 41 55);
        }
        section + section {
          border-color: rgb(75 85 99);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section lang="en">
        <h1>NPMOS is running</h1>
        <p>No site is set up for this address yet.</p>
        <p>Administrator: add a host for this domain in the NPMOS interface.</p>
      </section>
      <section lang="ru">
        <h1>NPMOS работает</h1>
        <p>Для этого адреса ещё не настроен сайт.</p>
        <p>Администратору: добавьте хост для этого домена в интерфейсе NPMOS.</p>
      </section>
    </main>
  </body>
</html>
