<!DOCTYPE html>
<!-- NPMOS: the file list of a host (fancyindex) in the look of the pages of NPMOS. nginx adds the path and </h1>
     after this header (fancyindex_show_path), then the table, then fancyindex-footer.html. -->
<html>
  <head>
    <title>Files</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <style>
      :root { color-scheme: light dark; --accent: #e11d48; }
      body { margin: 0; min-height: 100vh; padding: 16px; box-sizing: border-box;
        font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #f6f6f7; color: #18181b; }
      main { max-width: 60rem; margin: 8vh auto 0; padding: 2rem; box-sizing: border-box; border-radius: 16px; background: #fff;
        box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06); border-top: 4px solid var(--accent); }
      .code { color: var(--accent); font-weight: 600; letter-spacing: .04em; font-size: .8125rem; }
      h1 { margin: .25rem 0 1rem; font-size: 1.5rem; font-weight: 600; word-break: break-all; }
      #search { width: 100%; box-sizing: border-box; margin: 0 0 1rem; padding: .5rem .75rem; font: inherit; font-size: .9375rem;
        color: inherit; background: transparent; border: 1px solid #e4e4e7; border-radius: 8px; outline: none; }
      #search:focus { border-color: var(--accent); }
      #tableDiv { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; text-align: left; font-size: .9375rem; }
      th, td { padding: .5rem .75rem; border-bottom: 1px solid #e4e4e7; overflow-wrap: anywhere; }
      th { font-size: .8125rem; font-weight: 600; color: #71717a; white-space: nowrap; }
      th a { color: inherit; text-decoration: none; }
      td { color: #3f3f46; }
      td:not(:first-child) { white-space: nowrap; font-variant-numeric: tabular-nums; color: #71717a; }
      tr:last-child td { border-bottom: none; }
      tbody tr:hover td { background: #fafafa; }
      td a { color: #18181b; text-decoration: none; }
      td a:hover { color: var(--accent); text-decoration: underline; }
      @media (prefers-color-scheme: dark) {
        body { background: #0f0f11; color: #f4f4f5; }
        main { background: #18181b; box-shadow: none; }
        td { color: #d4d4d8; }
        td a { color: #f4f4f5; }
        th, td, #search { border-color: #27272a; }
        tbody tr:hover td { background: #1f1f23; }
      }
      @media (max-width: 600px) {
        main { margin-top: 0; padding: 1.25rem; }
        th, td { padding: .5rem; }
      }
    </style>
  </head>
  <body>
    <main id="box">
      <div class="code">NPMOS</div>
      <h1>
