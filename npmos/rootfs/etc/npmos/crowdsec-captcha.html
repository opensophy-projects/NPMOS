<!DOCTYPE html>
<!-- NPMOS: the captcha of CrowdSec (CAPTCHA_TEMPLATE_PATH), in the look of the pages of NPMOS. The placeholders,
     the form "captcha-form" and captchaCallback are those of the template of lua-cs-bouncer. -->
<html>
  <head>
    <title>Security check</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <style>
      :root { color-scheme: light dark; --accent: #e11d48; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
        font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #f6f6f7; color: #18181b; }
      main { max-width: 34rem; width: 100%; padding: 2rem; box-sizing: border-box; border-radius: 16px; background: #fff;
        box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06); border-top: 4px solid var(--accent); }
      .code { color: var(--accent); font-weight: 600; letter-spacing: .04em; font-size: .8125rem; }
      h1 { margin: .25rem 0 1rem; font-size: 1.5rem; font-weight: 600; }
      p { margin: 0 0 .75rem; line-height: 1.55; color: #3f3f46; }
      p:last-child { margin-bottom: 0; }
      section + section { margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid #e4e4e7; }
      section + section .code { display: none; }
      form { display: flex; justify-content: center; margin-top: 1.25rem; min-height: 78px; }
      @media (prefers-color-scheme: dark) {
        body { background: #0f0f11; color: #f4f4f5; }
        main { background: #18181b; box-shadow: none; }
        p { color: #d4d4d8; }
        section + section { border-color: #27272a; }
      }
    </style>
    <script src="{{captcha_frontend_js}}" async defer></script>
  </head>
  <body>
    <main>
      <section lang="en">
        <div class="code">CrowdSec</div>
        <h1>Security check</h1>
        <p>Confirm that you are not a robot to open the site.</p>
      </section>
      <section lang="ru">
        <div class="code">CrowdSec</div>
        <h1>Проверка безопасности</h1>
        <p>Подтвердите, что вы не робот, чтобы открыть сайт.</p>
      </section>
      <form action="" method="POST" id="captcha-form">
        <div id="captcha" class="{{captcha_frontend_key}}" data-sitekey="{{captcha_site_key}}" data-callback="captchaCallback"></div>
      </form>
    </main>
    <script>
      // the language of the browser first
      if (/^ru\b/i.test(navigator.language || "")) {
        const ru = document.querySelector('section[lang="ru"]');
        ru.parentNode.insertBefore(ru, ru.parentNode.firstChild);
      }
    </script>
    <script>
      function captchaCallback() {
        setTimeout(() => {
          document.querySelector("#captcha-form").submit();
        }, 500);
      }
    </script>
  </body>
</html>
