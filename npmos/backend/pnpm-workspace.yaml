minimumReleaseAge: 0
allowBuilds:
  '@scarf/scarf': false
  better-sqlite3: true
# NPMOS: versions with the fixes of known vulnerabilities (OSV-Scanner, .github/workflows/security.yml). Each line
# lifts only the versions below the fix and does nothing once upstream raises the package.
overrides:
  body-parser@<2.4.0: ^2.4.0
  brace-expansion@<5.0.12: ^5.0.12
  fast-uri@<3.1.9: ^3.1.9
  ip-address@<10.7.6: ^10.7.6
  js-yaml@<4.3.2: ^4.3.2
  minimatch@<11.0.1: ^11.0.5
  mysql2@<3.23.1: ^3.23.1
  proxy-addr@<2.0.8: ^2.0.8
  qs@<6.17.1: ^6.17.1
  yaml@<2.8.3: ^2.8.3
