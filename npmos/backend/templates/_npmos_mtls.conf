# NPMOS: mTLS (PKI and mTLS), see npmos/pki/mtls.js
ssl_verify_client {{ npmos_mtls.mode }};
# a resumed TLS session skips the check of the client certificate (and of the CRL): with the session cache
# of nginx (1 day) a revoked certificate kept working; every connection makes a full handshake instead
ssl_session_tickets off;
ssl_session_cache off;
ssl_verify_depth {{ npmos_mtls.depth }};
{% if npmos_mtls.send_ca_names %}
  ssl_client_certificate {{ npmos_mtls.ca_file }};
{% else %}
  ssl_trusted_certificate {{ npmos_mtls.ca_file }};
{% endif %}
{% if npmos_mtls.crl_file != "" %}ssl_crl {{ npmos_mtls.crl_file }};{% endif %}
{% if npmos_mtls.ocsp_url != "" %}
  # revocation by OCSP: the certificate of the client (on: and its CAs) is checked with NPMOS on every connection
  ssl_ocsp {{ npmos_mtls.ocsp_mode }};
  ssl_ocsp_responder {{ npmos_mtls.ocsp_url }};
  ssl_ocsp_cache shared:npmos_ocsp:10m;
{% endif %}

# 495: the certificate is not accepted, 496: no certificate. What the client gets (denied_page): the page of mTLS
# (403), the block page of NPMOS (403, filled in by conf.d/npmos-block-page.conf), the 404 page or no answer (444).
# Refused requests end in these locations: their own log becomes security events (npmos/pki/denials.js)
{% if npmos_mtls.denied_page == "blocked" or npmos_mtls.denied_page == "close" %}
error_page 495 496 @npmos_mtls_denied;
location @npmos_mtls_denied {
  access_log /data/nginx/logs/npmos-mtls.log {% if npmos_mtls.denied_page == "close" %}npmos_mtls_close{% else %}npmos_mtls{% endif %};
  {% if npmos_mtls.access_log %}access_log /data/nginx/logs/access.log alog;{% endif %}
  more_set_headers "Cache-Control: no-store";
  return {% if npmos_mtls.denied_page == "close" %}444{% else %}403{% endif %};
}
{% else %}
error_page 495 496 ={% if npmos_mtls.denied_page == "not_found" %}404{% else %}403{% endif %} /.npmos/mtls-denied.html;
location = /.npmos/mtls-denied.html {
  internal;
  access_log /data/nginx/logs/npmos-mtls.log npmos_mtls;
  {% if npmos_mtls.access_log %}access_log /data/nginx/logs/access.log alog;{% endif %}
  charset utf-8;
  more_set_headers "Cache-Control: no-store";
  alias /usr/local/nginx/html/{% if npmos_mtls.denied_page == "not_found" %}dead.html{% else %}npmos-mtls-denied.html{% endif %};
}
{% endif %}

set $npmos_mtls 0;
{% if npmos_mtls.issuers != "" %}if ($ssl_client_i_dn !~ "{{ npmos_mtls.issuers }}") { set $npmos_mtls 495; }{% endif %}
{% for rule in npmos_mtls.rules %}
  if ({{ rule.variable }} !~ "{{ rule.regex }}") { set $npmos_mtls 495; }
{% endfor %}
if ($ssl_client_verify != "SUCCESS") { set $npmos_mtls 495; }
if ($ssl_client_verify = "NONE") { set $npmos_mtls 496; }
if ($ssl_client_verify = "") { set $npmos_mtls 496; }
{% if ssl_forced %}if ($scheme = "http") { set $npmos_mtls 0; }{% endif %}
if ($uri = "/.npmos/mtls-denied.html") { set $npmos_mtls 0; }
{% if npmos_mtls.mode == "on" %}
  if ($npmos_mtls = 495) { return 495; }
  if ($npmos_mtls = 496) { return 496; }
{% endif %}

{% if npmos_mtls.headers %}
  # to the upstream; headers of the same names sent by clients are replaced
  more_set_input_headers "X-Client-Verify: $ssl_client_verify" "X-Client-S-DN: $ssl_client_s_dn" "X-Client-I-DN: $ssl_client_i_dn" "X-Client-Serial: $ssl_client_serial" "X-Client-Fingerprint: $ssl_client_fingerprint";
{% endif %}
