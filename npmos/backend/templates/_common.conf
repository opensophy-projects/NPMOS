server_name {{ server_names | join: " " }};

# NPMOS: the CrowdSec bouncer of NPMOS leaves this host out (CrowdSec → hosts)
{% if npmos_crowdsec_off %}set $npmos_crowdsec_off 1;{% endif %}

# NPMOS: countries let in or kept out (Hosts → a host → Countries, npmos/geo). Before anything else of the host;
# the ACME challenge and private addresses pass, and everything passes while nginx has no GeoIP database.
{% if npmos_geo %}
  set $npmos_geo "$npmos_geo_ready:$npmos_country";
  if ($npmos_geo_lan) { set $npmos_geo "lan"; }
  if ($uri ~ "^/\.well-known/acme-challenge/") { set $npmos_geo "acme"; }
  {% if npmos_geo.mode == "allow" %}
    if ($npmos_geo ~ "^1:(?!({{ npmos_geo.pattern }})$)") { return {{ npmos_geo.action }}; }
  {% else %}
    if ($npmos_geo ~ "^1:({{ npmos_geo.pattern }})$") { return {{ npmos_geo.action }}; }
  {% endif %}
{% endif %}

listen unix:/run/nginx.sock;

{% if env.DISABLE_HTTP == "false" %}
  listen {{ env.IPV4_BINDING }}:{{ env.HTTP_PORT }}{% if env.LISTEN_PROXY_PROTOCOL_HTTP == "true" %} proxy_protocol{% endif %};
  {% if env.DISABLE_IPV6 == "false" %}listen {{ env.IPV6_BINDING }}:{{ env.HTTP_PORT }}{% if env.LISTEN_PROXY_PROTOCOL_HTTP == "true" %} proxy_protocol{% endif %};{% endif %}
{% endif %}

{% if certificate and certificate_id > 0 %}
  listen {{ env.IPV4_BINDING }}:{{ env.HTTPS_PORT }} ssl{% if env.LISTEN_PROXY_PROTOCOL_HTTPS == "true" %} proxy_protocol{% endif %};
  {% if env.DISABLE_IPV6 == "false" %}listen {{ env.IPV6_BINDING }}:{{ env.HTTPS_PORT }} ssl{% if env.LISTEN_PROXY_PROTOCOL_HTTPS == "true" %} proxy_protocol{% endif %};{% endif %}

  {% if env.DISABLE_H3_QUIC == "false" %}
    listen {{ env.IPV4_BINDING }}:{{ env.HTTPS_PORT }} quic;
    {% if env.DISABLE_IPV6 == "false" %}listen {{ env.IPV6_BINDING }}:{{ env.HTTPS_PORT }} quic;{% endif %}
    {% if npmplus_http3_support %}more_set_headers 'Alt-Svc: h3=":$alt_svc_port"; ma=86400';{% endif %}
  {% endif %}

  {% if certificate.provider == "letsencrypt" %}
    # Certbot TLS
    ssl_certificate /data/tls/certbot/live/npm-{{ certificate_id }}/fullchain.pem;
    ssl_certificate_key /data/tls/certbot/live/npm-{{ certificate_id }}/privkey.pem;
    {% if env.ACME_OCSP_STAPLING == "true" %}
      ssl_stapling on;
      ssl_stapling_verify on;
      ssl_stapling_file /data/tls/certbot/live/npm-{{ certificate_id }}.der;
      ssl_certificate_compression off;
    {% endif %}
  {% else %}
    # Custom TLS
    ssl_certificate /data/tls/custom/npm-{{ certificate_id }}/fullchain.pem;
    ssl_certificate_key /data/tls/custom/npm-{{ certificate_id }}/privkey.pem;
    {% if env.CUSTOM_OCSP_STAPLING == "true" %}
      ssl_stapling on;
      ssl_stapling_verify on;
      ssl_stapling_file /data/tls/custom/npm-{{ certificate_id }}.der;
      ssl_certificate_compression off;
    {% endif %}
  {% endif %}

  # NPMOS: mTLS of PKI and mTLS replaces the mTLS CA of NPMplus
  {% if npmos_mtls %}
    {% include "_npmos_mtls.conf" %}
  {% elsif meta and meta.npmplus_mtls_certificate_id and meta.npmplus_mtls_certificate_id > 0 %}
    ssl_verify_client {% if meta.npmplus_mtls_verify_client_optional == true %}optional{% else %}on{% endif %};
    ssl_client_certificate /data/tls/mtls/npm-{{ meta.npmplus_mtls_certificate_id }}.pem;
  {% endif %}

  {% if ssl_forced %}
    # NPMOS: the ACME challenge is answered over HTTP, not redirected: an "if" of the server runs before the
    # locations, so the challenge went to HTTPS with the certificate of this server; step-ca, Pebble and other ACME
    # servers that check it (or keep the port) failed HTTP-01 for a domain without a host or with "Force HTTPS".
    set $npmos_to_https "$scheme:$http_x_forwarded_proto";
    if ($uri ~ "^/\.well-known/acme-challenge/") {
      set $npmos_to_https "acme";
    }
    if ($npmos_to_https ~ "^http:|:http$") {
      return 301 https://$host$is_request_port$request_port$request_uri;
    }
    {% if hsts_enabled %}
      {% if hsts_subdomains %}
        more_set_headers "Strict-Transport-Security: $hsts_includeSubDomains_header";
      {% else %}
        more_set_headers "Strict-Transport-Security: $hsts_header";
      {% endif %}
    {% else %}
        more_clear_headers "Strict-Transport-Security";
    {% endif %}
  {% else %}
    more_clear_headers "Strict-Transport-Security";
  {% endif %}
{% else %}
  more_clear_headers "Strict-Transport-Security";
{% endif %}

location /.well-known/acme-challenge/ {
    root /data/tls/certbot/acme-challenge;
    fancyindex off;
    index off;
    allow all;
    auth_basic off;
    auth_request off;
}
