# ----------------------------------------------------------------------
# {{ domain_names | join: ", " }}
# DO NOT EDIT THIS FILE DIRECTLY, CHANGES WILL BE LOST WHEN UPDATING!
# ----------------------------------------------------------------------

{% if enabled %}
  {% comment %}NPMOS: "auto" (the default of the form of NPMplus, not an option of its list) keeps the scheme{% endcomment %}
  {% if forward_scheme == "auto" %}{% assign forward_scheme = "$scheme" %}{% endif %}
  server {
    {% include "_common.conf" %}

    {% if forward_http_code == 300 %}
      # NPMOS: nginx sets Location only for 301-308: with "return 300 <url>" the address was the body and the browser
      # stayed on the page
      location / {
        more_set_headers "Location: {{ forward_scheme }}://{{ forward_domain_name }}{% if preserve_path %}$request_uri{% endif %}";
        return 300 "{{ forward_scheme }}://{{ forward_domain_name }}{% if preserve_path %}$request_uri{% endif %}";
      }
    {% else %}
      location / { return {{ forward_http_code }} {{ forward_scheme }}://{{ forward_domain_name }}{% if preserve_path %}$request_uri{% endif %}; }
    {% endif %}

    {{ advanced_config }}

    # Custom
    include /data/custom_nginx/server_http.conf;
    include /data/custom_nginx/server_redirect.conf;
  }
{% endif %}
