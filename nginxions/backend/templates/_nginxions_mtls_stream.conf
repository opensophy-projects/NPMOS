# NginxionS: mTLS (PKI and mTLS), see nginxions/pki/mtls.js
ssl_verify_client on;
# a resumed TLS session skips the check of the client certificate (and of the CRL): with the session cache
# of nginx (1 day) a revoked certificate kept working; every connection makes a full handshake instead
ssl_session_tickets off;
ssl_session_cache off;
ssl_verify_depth {{ nginxions_mtls.depth }};
{% if nginxions_mtls.send_ca_names %}
  ssl_client_certificate {{ nginxions_mtls.ca_file }};
{% else %}
  ssl_trusted_certificate {{ nginxions_mtls.ca_file }};
{% endif %}
{% if nginxions_mtls.crl_file != "" %}ssl_crl {{ nginxions_mtls.crl_file }};{% endif %}
