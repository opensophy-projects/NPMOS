# NginxionS: mTLS (PKI and mTLS), see nginxions/pki/mtls.js
ssl_verify_client {{ nginxions_mtls.mode }};
# a resumed TLS session skips the check of the client certificate (and of the CRL): with the session cache
# of nginx (1 day) a revoked certificate kept working; every connection makes a full handshake instead
ssl_session_tickets off;
ssl_session_cache off;
ssl_verify_depth {{ nginxions_mtls.depth }};
{% if nginxions_mtls.send_ca_names %}
  ssl_client_certificate {{ nginxions_mtls.ca_file }};
{% else %}
  ssl_trusted_certificate {{ nginxions_mtls.ca_file }};
{% endif %}
{% if nginxions_mtls.crl_file != "" %}ssl_crl {{ nginxions_mtls.crl_file }};{% endif %}
{% if nginxions_mtls.ocsp_url != "" %}
  # revocation by OCSP: the certificate of the client (on: and its CAs) is checked with NginxionS on every connection
  ssl_ocsp {{ nginxions_mtls.ocsp_mode }};
  ssl_ocsp_responder {{ nginxions_mtls.ocsp_url }};
  ssl_ocsp_cache shared:nginxions_ocsp:10m;
{% endif %}

# 495: the certificate is not accepted, 496: no certificate. What the client gets (denied_page): the page of mTLS
# (403), the block page of NginxionS (403, filled in by conf.d/nginxions-block-page.conf), the 404 page or no answer (444).
# Refused requests end in these locations: their own log becomes security events (nginxions/pki/denials.js)
{% if nginxions_mtls.denied_page == "blocked" or nginxions_mtls.denied_page == "close" %}
error_page 495 496 @nginxions_mtls_denied;
location @nginxions_mtls_denied {
  access_log /data/nginx/logs/nginxions-mtls.log {% if nginxions_mtls.denied_page == "close" %}nginxions_mtls_close{% else %}nginxions_mtls{% endif %};
  {% if nginxions_mtls.access_log %}access_log /data/nginx/logs/access.log alog;{% endif %}
  access_log /data/nginx/logs/nginxions-requests.log nginxions_requests;
  more_set_headers "Cache-Control: no-store";
  return {% if nginxions_mtls.denied_page == "close" %}444{% else %}403{% endif %};
}
{% else %}
error_page 495 496 ={% if nginxions_mtls.denied_page == "not_found" %}404{% else %}403{% endif %} /.nginxions/mtls-denied.html;
location = /.nginxions/mtls-denied.html {
  internal;
  access_log /data/nginx/logs/nginxions-mtls.log nginxions_mtls;
  {% if nginxions_mtls.access_log %}access_log /data/nginx/logs/access.log alog;{% endif %}
  access_log /data/nginx/logs/nginxions-requests.log nginxions_requests;
  charset utf-8;
  more_set_headers "Cache-Control: no-store";
  alias /usr/local/nginx/html/{% if nginxions_mtls.denied_page == "not_found" %}dead.html{% else %}nginxions-mtls-denied.html{% endif %};
}
{% endif %}

set $nginxions_mtls 0;
{% if nginxions_mtls.issuers != "" %}if ($ssl_client_i_dn !~ "{{ nginxions_mtls.issuers }}") { set $nginxions_mtls 495; }{% endif %}
{% for rule in nginxions_mtls.rules %}
  if ({{ rule.variable }} !~ "{{ rule.regex }}") { set $nginxions_mtls 495; }
{% endfor %}
if ($ssl_client_verify != "SUCCESS") { set $nginxions_mtls 495; }
if ($ssl_client_verify = "NONE") { set $nginxions_mtls 496; }
if ($ssl_client_verify = "") { set $nginxions_mtls 496; }
{% if ssl_forced %}if ($scheme = "http") { set $nginxions_mtls 0; }{% endif %}
if ($uri = "/.nginxions/mtls-denied.html") { set $nginxions_mtls 0; }
{% if nginxions_mtls.mode == "on" %}
  if ($nginxions_mtls = 495) { return 495; }
  if ($nginxions_mtls = 496) { return 496; }
{% endif %}

{% if nginxions_mtls.headers %}
  # to the upstream; headers of the same names sent by clients are replaced
  more_set_input_headers "X-Client-Verify: $ssl_client_verify" "X-Client-S-DN: $ssl_client_s_dn" "X-Client-I-DN: $ssl_client_i_dn" "X-Client-Serial: $ssl_client_serial" "X-Client-Fingerprint: $ssl_client_fingerprint";
{% endif %}
