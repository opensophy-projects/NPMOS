# NginxionS: the hub index of CrowdSec for the crowdsec container (its start script runs `cscli hub
# update` once a day), served from the config volume both share: never the public CDN. Port 7480 is
# not published (deploy/compose.yaml), the index is public data. See nginxions/backend/nginxions/crowdsec.
server {
  listen 0.0.0.0:7480;
  server_name _;
  access_log off;

  location /.nginxions/crowdsec-hub/master/ {
    alias /etc/crowdsec/hub/;
    default_type application/json;
  }

  location / {
    return 404;
  }
}
