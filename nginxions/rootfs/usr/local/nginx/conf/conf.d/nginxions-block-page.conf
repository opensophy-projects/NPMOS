# NginxionS: the block page (Agents → Block page). A 403 nginx answers itself (open-appsec, the CrowdSec bouncer,
# an access list), not one of an upstream, gets the page NginxionS renders into /data/nginxions/block-page.html; the
# admin interface (port 81) and the pages of NginxionS (/.nginxions/) keep their own.
# The other errors nginx answers itself (502 when the server of a site does not answer, 504, 401, 413, 429…) get
# the error page of NginxionS (html/nginxions-error.html) in place of the bare page of nginx; answers of the server of a
# site are passed on as they are.
header_filter_by_lua_block {
  -- loaded once per worker (the path of the CrowdSec bouncer is the only lua_package_path)
  local bp = package.loaded.nginxions_block_page
  if not bp then
    bp = dofile("/usr/local/lua/nginxions/nginxions_block_page.lua")
    package.loaded.nginxions_block_page = bp
  end
  local ep = package.loaded.nginxions_error_page
  if not ep then
    ep = dofile("/usr/local/lua/nginxions/nginxions_error_page.lua")
    package.loaded.nginxions_error_page = ep
  end
  if ngx.var.server_port == "81" then return end
  local page
  if ngx.status == 403 then
    local upstream = ngx.var.upstream_status
    if upstream ~= nil and upstream ~= "" then return end
    if string.sub(ngx.var.uri or "", 1, 8) == "/.nginxions/" then return end
    page = bp.page()
    if page then page = bp.fill(page) end
  elseif ep.wanted() then
    page = ep.page()
  end
  if not page then return end
  ngx.ctx.nginxions_page = page
  ngx.header["Content-Type"] = "text/html; charset=utf-8"
  ngx.header["Content-Length"] = nil
  ngx.header["Content-Encoding"] = nil
  ngx.header["Cache-Control"] = "no-store"
}
body_filter_by_lua_block {
  local page = ngx.ctx.nginxions_page
  if not page then return end
  if ngx.ctx.nginxions_page_sent then
    ngx.arg[1] = nil
    return
  end
  ngx.ctx.nginxions_page_sent = true
  ngx.arg[1] = page
  ngx.arg[2] = true
}
