# NginxionS: requests refused by mTLS (locations /.nginxions/mtls-denied.html and @nginxions_mtls_denied of _nginxions_mtls.conf), read by
# nginxions/pki/denials.js into the security events
log_format nginxions_mtls escape=json '{"time":"$time_iso8601","status":"$status","host":"$host","ip":"$remote_addr","method":"$request_method","uri":"$request_uri","verify":"$ssl_client_verify","s_dn":"$ssl_client_s_dn","i_dn":"$ssl_client_i_dn","serial":"$ssl_client_serial","ua":"$http_user_agent"}';
# denied_page close: nginx logs the 400 of the refused handshake, not the 444 it answers with
log_format nginxions_mtls_close escape=json '{"time":"$time_iso8601","status":"444","host":"$host","ip":"$remote_addr","method":"$request_method","uri":"$request_uri","verify":"$ssl_client_verify","s_dn":"$ssl_client_s_dn","i_dn":"$ssl_client_i_dn","serial":"$ssl_client_serial","ua":"$http_user_agent"}';
