# NginxionS: countries of the clients for the countries of the hosts (nginxions/geo). Written by the backend.
geo $nginxions_geo_lan {
  default 0;
  127.0.0.0/8 1;
  10.0.0.0/8 1;
  172.16.0.0/12 1;
  192.168.0.0/16 1;
  100.64.0.0/10 1;
  169.254.0.0/16 1;
  ::1/128 1;
  fc00::/7 1;
  fe80::/10 1;
}
map "" $nginxions_country { default ""; }
map "" $nginxions_geo_ready { default 0; }
