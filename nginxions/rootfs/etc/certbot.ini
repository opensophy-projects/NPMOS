# NginxionS: the debug log of certbot outside /tmp (the shared temporary directory), in the data of NginxionS, which reads
# it for "Full log" of a failed certificate; ten logs kept, not a thousand
logs-dir = /data/nginxions/acme/certbot-log
max-log-backups = 10
work-dir = /tmp/certbot-work
config-dir = /data/tls/certbot
webroot-path = /data/tls/certbot/acme-challenge

agree-tos = true
non-interactive  = true
no-random-sleep-on-renew = true
no-eff-email = true

rsa-key-size = 4096
elliptic-curve = secp384r1

#required-profile
key-type = ecdsa
must-staple = true
no-verify-ssl = false
