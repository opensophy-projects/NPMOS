  react-router@<7.18.2: ^7.18.2
  react-router-dom@<7.18.2: ^7.18.2
  source-map-js@<1.2.2: ^1.2.2
  vite@<8.3.3: ^8.3.3
  vitest@<4.1.12: ^4.1.12
  "@vitest/mocker@<4.1.12": ^4.1.12
